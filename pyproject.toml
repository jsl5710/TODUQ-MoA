[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toduq-moa"
version = "0.1.0"
description = "Mixture-of-Agents with expert routing under uncertainty — companion to TODUQ."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mixture-of-agents", "uncertainty", "rag", "human-in-the-loop", "agentic-ai"]

dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
closed = ["anthropic>=0.40", "openai>=1.30"]
rag = ["sqlalchemy>=2.0", "chromadb>=0.5"]   # relational + vector backends
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
toduq-moa = "toduq_moa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
